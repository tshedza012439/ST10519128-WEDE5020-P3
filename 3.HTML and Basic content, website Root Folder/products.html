    <!-- Website Header -->

        <h1>Tshipidi Bakery
        <img src="images/galery.png" alt="250".height="250">

        <!-- Navigation Menu -->
        <nav>

    <!-- Main Content -->

        <section class="page-intro">
    <h1>Our Products</h1>
    <p>Explore our freshly baked cakes, cupcakes, bread and biscuits.</p>
</section>

<section class="content-section">
    <h2>Find a Product</h2>

    <label for="product-search">Search products:</label>
    <input
        type="search"
        id="product-search"
        placeholder="Search for cakes, bread or biscuits..."
    >

    <label for="category-filter">Choose a category:</label>
    <select id="category-filter">
        <option value="all">All Products</option>
        <option value="cakes">Cakes</option>
        <option value="cupcakes">Cupcakes</option>
        <option value="bread">Bread</option>
        <option value="biscuits">Biscuits</option>
    </select>

    <p id="product-results" aria-live="polite"></p>

    <div id="product-list" class="product-grid">
        <p>Loading products...</p>
    </div>
</section>
